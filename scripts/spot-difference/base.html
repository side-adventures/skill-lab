<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generated scenes 2</title>
<style>
body{background:#0b1120;color:#e2e8f0;font-family:system-ui,sans-serif;margin:0;padding:12px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
p.sub{color:#94a3b8;margin:0 0 20px;font-size:14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px 14px;margin-bottom:14px;width:fit-content}
.head{display:flex;flex-wrap:wrap;max-width:692px;align-items:center;gap:10px;margin-bottom:10px}
.head b{font-size:15px;white-space:nowrap}.head span{color:#94a3b8;font-size:13px;white-space:nowrap}.head .grow{flex:1}
button{background:#1f2937;color:#e2e8f0;border:1px solid #374151;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.pair{display:flex;gap:12px}
.pair svg{width:340px;height:255px;flex:0 0 340px;border-radius:6px;cursor:crosshair;display:block}
</style></head><body>
<h1>Spot the Difference · generated scenes, round 2</h1>
<p class="sub">“New picture” builds a new scene from random parts. “New differences” keeps the picture and picks 3 other changes from everything in it.</p>
<div id="out"></div>
<script>
const R=(x,y,w,h,f,a='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${a}/>`;
const C=(x,y,r,f,a='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${a}/>`;
const E=(x,y,rx,ry,f,a='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${a}/>`;
const Pg=(p,f,a='')=>`<polygon points="${p}" fill="${f}" ${a}/>`;
const Pa=(d,f,a='')=>`<path d="${d}" fill="${f}" ${a}/>`;
const L=(x1,y1,x2,y2,s,w=1)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;
const T=(x,y,s,f,txt)=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f}" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle">${txt}</text>`;
const G=(tr,inner)=>`<g transform="${tr}">${inner}</g>`;
const flip=(cx,inner,on)=>on?G(`translate(${2*cx},0) scale(-1,1)`,inner):inner;
function lcg(s){return()=>(s=(s*16807)%2147483647)/2147483647;}
const stars=(seed,n,maxY,w=120)=>{const r=lcg(seed);let s='';for(let i=0;i<n;i++)s+=C((r()*w).toFixed(1),(r()*maxY).toFixed(1),(0.3+r()*0.4).toFixed(2),'#e2e8f0');return s;};
const cloud=(x,y,s=1,c='#cbd5e1')=>G(`translate(${x},${y}) scale(${s})`,E(0,0,8,3.5,c)+E(4,-2.5,5,3.5,c)+E(-4,-1.5,4,2.8,c));
const bird=(x,y,c='#e2e8f0')=>`<path d="M${x} ${y} q1.5 -1.5 3 0 q1.5 -1.5 3 0" stroke="${c}" stroke-width="0.6" fill="none"/>`;
const tree=(x,y,s=1,c='#3f7d3a')=>R(x-1.2*s,y-8*s,2.4*s,8*s,'#5b3a1e')+C(x,y-11*s,5.5*s,c);
const pine=(x,y,s=1,c='#2f6b3a')=>R(x-0.8*s,y-3*s,1.6*s,3*s,'#5b3a1e')+Pg(`${x-5*s},${y-3*s} ${x+5*s},${y-3*s} ${x},${y-17*s}`,c);
const pb=(x,y,s,b)=>[x+b[0]*s,y+b[1]*s,b[2]*s,b[3]*s];

/* person: feet at (x,y), about 25 units tall at s=1 */
function person(x,y,s,o){const k=o.skin||'#e0ac69';let g='';
  if(o.item==='umbrella')g+=L(-4.9,-8.6,-4.9,-30,'#475569',0.5)+Pa('M-12 -30 a7.1 4.5 0 0 1 14.2 0 Z',o.ucol||'#22c55e');
  if(o.dress){g+=R(-2.6,-6,1.8,6,k)+R(0.8,-6,1.8,6,k)+Pg('-5,-6 5,-6 3.6,-18 -3.6,-18',o.dress);}
  else if(o.shorts){g+=R(-3,-5.5,2.4,5.5,k)+R(0.6,-5.5,2.4,5.5,k)+R(-3.3,-9.5,6.6,4.5,o.pants);}
  else g+=R(-3,-9.5,2.5,9.5,o.pants)+R(0.5,-9.5,2.5,9.5,o.pants);
  g+=R(-3.5,-1.2,3.1,1.4,o.shoes||'#1f2937','rx="0.5"')+R(0.4,-1.2,3.1,1.4,o.shoes||'#1f2937','rx="0.5"');
  if(!o.dress){g+=R(-4,-18,8,10,o.shirt,'rx="1.5"');if(o.stripes)g+=R(-4,-15.2,8,1.2,'#f1f5f9')+R(-4,-12.2,8,1.2,'#f1f5f9');}
  const sc=o.dress||o.shirt;g+=R(-5.8,-17.5,1.8,8.5,sc,'rx="0.9"')+R(4,-17.5,1.8,8.5,sc,'rx="0.9"')+C(-4.9,-8.6,1,k)+C(4.9,-8.6,1,k);
  if(o.bag)g+=L(-3,-18,3.5,-11,o.bag,0.6)+R(3,-12,4,4,o.bag,'rx="0.6"');
  if(o.scarf)g+=R(-3,-18.8,6,1.9,o.scarf,'rx="0.5"')+R(0.8,-18,1.6,4.2,o.scarf);
  g+=C(0,-21.5,3.2,k);
  if(o.long)g+=R(-3.5,-22,1.4,5.5,o.hair)+R(2.1,-22,1.4,5.5,o.hair);
  if(o.hair)g+=Pa('M-3.4 -21.4 a3.4 3.4 0 0 1 6.8 0 Z',o.hair);
  if(o.glasses)g+=C(-1.25,-21.3,1,'none','stroke="#111" stroke-width="0.45"')+C(1.25,-21.3,1,'none','stroke="#111" stroke-width="0.45"');
  if(o.hat==='cap')g+=Pa('M-3.5 -22.6 a3.5 3.3 0 0 1 7 0 Z',o.hcol)+R(1,-23.4,4.5,0.9,o.hcol);
  if(o.hat==='top')g+=R(-2.6,-29.5,5.2,5.5,o.hcol)+R(-3.9,-24.6,7.8,1.1,o.hcol);
  if(o.hat==='beanie')g+=Pa('M-3.5 -22 a3.5 3.8 0 0 1 7 0 Z',o.hcol)+C(0,-25.8,0.9,'#f1f5f9');
  if(o.hat==='straw')g+=E(0,-23.6,5.5,1,o.hcol)+Pa('M-3 -23.6 a3 3 0 0 1 6 0 Z',o.hcol);
  if(o.hat==='helmet')g+=Pa('M-3.6 -22 a3.6 3.8 0 0 1 7.2 0 Z','#94a3b8');
  if(o.item==='balloon')g+=L(4.9,-8.6,7,-26.5,'#e5e7eb',0.3)+E(7,-30,3,3.6,o.icol);
  if(o.item==='ice')g+=Pg('4.1,-9 5.7,-9 4.9,-5.6','#d6a35a')+C(4.9,-9.8,1.4,o.icol);
  if(o.item==='phone')g+=R(4.1,-11,1.7,2.8,'#111827');
  if(o.item==='flowers')g+=L(4.9,-8.6,4,-13.5,'#16a34a',0.4)+L(4.9,-8.6,6,-13.8,'#16a34a',0.4)+C(4,-14,1,'#f472b6')+C(6,-14.3,1,'#facc15')+C(5,-15.4,1,'#f87171');
  if(o.item==='bucket')g+=Pg('4,-8 8,-8 7.5,-4.5 4.5,-4.5','#94a3b8');
  if(o.item==='spear')g+=L(5,-4,5,-30,'#a16207',0.5)+Pg('4.2,-30 5.8,-30 5,-33','#cbd5e1');
  if(o.item==='stick')g+=L(5,0,6.5,-14,'#a16207',0.6);
  if(o.shades)g+=R(-2.6,-22.2,5.2,1.7,'#111','rx="0.6"');
  if(o.dog)g+=L(-4.9,-8.6,-10,-4.5,'#334155',0.3)+E(-11.5,-3,3,1.7,o.dog)+C(-14.2,-4.3,1.4,o.dog)+L(-13.5,-1.5,-13.5,0,o.dog,0.7)+L(-9.5,-1.5,-9.5,0,o.dog,0.7)+L(-8.6,-3.5,-7.5,-5,o.dog,0.6);
  return G(`translate(${x},${y}) scale(${s})`,g);}
const PB={hat:[-4.5,-30,9.5,8],hair:[-4,-25,8,8],glasses:[-2.8,-23,5.6,3.4],shirt:[-6,-18.5,12,10.5],pants:[-3.5,-10,7,9],shoes:[-3.8,-1.6,7.6,2],bag:[2.5,-12.5,5,5],balloon:[3.5,-34,7.5,9],ice:[3.4,-11.6,3,6.4],scarf:[-3.5,-19.2,6.6,5],dog:[-16,-6,9,6.5],phone:[3.6,-11.6,3,4],umbrella:[-12.5,-35,15.5,6],flowers:[2.5,-16.5,5,5],bucket:[3.5,-8.5,5,4.5],spear:[3.8,-33.5,2.4,8]};

/* side-view car, nose to the right; flipped faces left */
const carSide=(x,y,c,f)=>flip(x+11,R(x,y+4,22,6,c,'rx="2"')+R(x+4,y,12,5,c,'rx="1.5"')+R(x+11,y+1,4,3,'#bae6fd')+R(x+5,y+1,4.5,3,'#bae6fd')+R(x+20.8,y+5.5,1.2,1.5,'#fde68a')+C(x+5,y+10,2.4,'#111')+C(x+17,y+10,2.4,'#111')+C(x+5,y+10,0.9,'#9ca3af')+C(x+17,y+10,0.9,'#9ca3af'),f);

const SC=[];
const add=(group,name,sub,diffs,draw)=>SC.push({group,name,sub,diffs,draw});

/* ---------- extra helpers ---------- */
const cat=(x,y,c='#111',f=false)=>flip(x,E(x,y,2.6,1.6,c)+C(x+2.5,y-1.4,1.3,c)+Pg(`${x+1.7},${y-2.2} ${x+2.1},${y-3.6} ${x+2.7},${y-2.4}`,c)+Pg(`${x+2.9},${y-2.4} ${x+3.5},${y-3.6} ${x+3.7},${y-2}`,c)+`<path d="M${x-2.4} ${y} q-1.5 -2 -0.5 -4" stroke="${c}" stroke-width="0.7" fill="none"/>`,f);
const people=(P,h)=>{let s='';for(const[x,y,sc,o,ds]of P){let oo={...o};for(const k in ds)if(h(k))Object.assign(oo,ds[k][1]);s+=person(x,y,sc,oo);}return s;};
const pdiff=(P,d)=>P.forEach(([x,y,s,o,ds])=>{for(const k in ds)d[k]=pb(x,y,s,PB[ds[k][0]]);});
const pine2=(x,y,s,dk,lt)=>R(x-0.8*s,y-3*s,1.6*s,3*s,'#4a3222')+Pg(`${x-5*s},${y-3*s} ${x},${y-3*s} ${x},${y-17*s}`,dk)+Pg(`${x},${y-3*s} ${x+5*s},${y-3*s} ${x},${y-17*s}`,lt);
const umbrella=(x,y,c1,c2)=>L(x,y,x,y+20,'#f1f5f9',1)+`<path d="M${x-11} ${y} A11 9 0 0 1 ${x+11} ${y} Z" fill="${c1}"/>`+`<path d="M${x-4} ${y} L${x} ${y-9} L${x+4} ${y} Z" fill="${c2}"/>`;
function fish(x,y,c,dir,pat,s=1){const inner=E(0,0,6,3.6,c)+Pg('-5.5,0 -10,-3.5 -10,3.5',c)+C(3.5,-0.8,0.8,'#111')+
  (pat==='stripes'?R(-1.5,-3.2,1.4,6.4,'#f1f5f9')+R(1,-3.4,1.2,6.8,'#f1f5f9'):pat==='dots'?C(-1,-1,0.8,'#1f2937')+C(1,1.2,0.8,'#1f2937')+C(-2.5,1,0.7,'#1f2937'):'');
  return G(`translate(${x},${y}) scale(${dir*s},${s})`,inner);}

const duck=(x,y,hc,f)=>flip(x,E(x,y,2.6,1.5,'#a16207')+C(x+2.3,y-1.7,1.1,hc)+Pg(`${x+3.2},${y-1.9} ${x+4.4},${y-1.6} ${x+3.2},${y-1.3}`,'#f59e0b'),f);
const swan=(x,y,f,bc='#f97316')=>flip(x,E(x,y,3.4,1.8,'#f8fafc')+`<path d="M${x+2.4} ${y-0.6} q2 -1 1 -3.5 q-0.6 -1.6 0.8 -2.2" stroke="#f8fafc" stroke-width="1.1" fill="none"/>`+C(x+4.3,y-6.2,0.9,'#f8fafc')+Pg(`${x+5},${y-6.4} ${x+6.4},${y-5.9} ${x+5},${y-5.5}`,bc),f);
const lily=(x,y,fl)=>Pa(`M${x-3} ${y} a3 1.4 0 1 0 6 0 l-3 -0.2 Z`,'#16a34a')+(fl?C(x+0.5,y-0.6,1,'#f9a8d4'):'');
/* ================= generator engine ================= */
const PAL=[['#1f2937',0],['#7c3aed',1],['#2563eb',1.5],['#dc2626',2],['#16a34a',2],['#0ea5e9',3],['#f97316',3],['#f472b6',3.5],['#a3e635',4],['#facc15',4.5],['#fde68a',5],['#f1f5f9',6]];
const Lof=c=>{const f=PAL.find(p=>p[0]===c);return f?f[1]:3;};
const rnd=s=>{let a=s>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const pk=(r,a)=>a[Math.floor(r()*a.length)];
const shuf=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const other=(r,c,pal=PAL.map(p=>p[0]))=>{const L0=Lof(c);const o=pal.filter(x=>Math.abs(Lof(x)-L0)>=2);return pk(r,o.length?o:pal.filter(x=>x!==c));};
const tog=(p,key,b)=>({t:p[key]?'remove':'add',p2:{...p,[key]:!p[key]},b});
const K={raw:{draw:p=>p.s}};

/* person with a random wardrobe */
const SHIRTS=['#2563eb','#dc2626','#16a34a','#7c3aed','#f97316','#facc15','#f472b6','#0ea5e9','#f1f5f9','#14b8a6'];
const PANTS=['#1e3a8a','#374151','#1f2937','#78350f'];const HAIR=['#111','#3f2a1d','#7c2d12','#eab308','#d6d3d1'];const SKIN=['#f1c27d','#e0ac69','#c68642','#8d5524','#ffdbac'];
function wardrobe(r,o={}){const dress=r()<0.3;const w={skin:pk(r,SKIN),hair:pk(r,HAIR),shoes:pk(r,['#1f2937','#f1f5f9','#be185d','#78350f'])};
  if(dress){w.dress=pk(r,SHIRTS);w.long=1;}else{w.shirt=pk(r,SHIRTS);w.pants=pk(r,PANTS);if(r()<0.35)w.stripes=1;}
  if(r()<0.4){w.hat=pk(r,['cap','beanie']);w.hcol=pk(r,SHIRTS);}
  if(r()<0.35)w.glasses=1;if(r()<0.3)w.bag=pk(r,['#92400e','#1f2937','#7c3aed']);
  if(!o.noItem&&r()<0.45){w.item=pk(r,['balloon','ice','flowers']);w.icol=pk(r,['#ef4444','#facc15','#22c55e','#a78bfa','#f472b6']);}
  if(!o.noDog&&r()<0.3)w.dog=pk(r,['#a16207','#e5e7eb','#1f2937']);
  if(w.dog&&w.item==='umbrella')delete w.item;return w;}
K.person={draw:p=>p.on===false?'':person(p.x,p.y,p.s,p.o),muts:(p,r)=>{const o=p.o,m=[],b=k=>pb(p.x,p.y,p.s,PB[k]),set=(t,ch,k)=>m.push({t,p2:{...p,o:{...o,...ch}},b:b(k)});
  set(o.glasses?'remove':'add',{glasses:o.glasses?0:1},'glasses');
  if(o.hat)set('remove',{hat:''},'hat');else set('add',{hat:'cap',hcol:pk(r,SHIRTS)},'hat');
  if(o.hat)set('color',{hcol:other(r,o.hcol,SHIRTS)},'hat');
  if(o.shirt){set('color',{shirt:other(r,o.shirt,SHIRTS)},'shirt');set(o.stripes?'remove':'add',{stripes:o.stripes?0:1},'shirt');}
  if(o.dress)set('color',{dress:other(r,o.dress,SHIRTS)},'shirt');
  if(o.bag)set('remove',{bag:''},'bag');
  if(o.item==='balloon'||o.item==='ice')set('color',{icol:other(r,o.icol,['#ef4444','#facc15','#22c55e','#a78bfa','#f472b6','#f1f5f9','#2563eb'])},o.item);
  if(o.item==='flowers')set('remove',{item:''},'flowers');
  if(o.dog)set('remove',{dog:''},'dog');
  set('color',{hair:other(r,o.hair,HAIR)},'hair');
  return m;}};

const CAT={person:'people',win:'windows',bld2:'buildings',nbld:'buildings',roof:'rooftops',gap:'street',lamp:'street',bin:'street',hydrant:'street',car:'vehicles',bus:'vehicles',
  tree:'nature',shore:'nature',pond:'water',birds:'sky',cloud:'sky',star:'stars',moon:'sky',blimp:'sky',planetA:'planets',planetB:'planets',smoon:'planets',rocks:'planets',
  rocket:'craft',sat:'craft',ufo:'craft',astro:'astronaut',cup:'cupboards',lower:'cupboards',sill:'wall',wall:'wall',tool:'wall',tile:'wall',counter:'counter',stove:'stove',oven:'stove',magnet:'fridge',drawing:'fridge'};
const isEasy=c=>{const a=c.b[2]*c.b[3];return((c.t==='remove'||c.t==='add')&&a>=50)||(c.t==='color'&&a>=40);};
function pickDiffs(items,r){
  const cands=[];items.forEach((it,i)=>{const k=K[it.kind];if(!k.muts)return;k.muts(it.p,r).forEach(m=>{const c={i,...m,g:m.g||it.g,cat:CAT[it.kind]||it.kind};c.easy=isEasy(c);cands.push(c);});});
  const tryPick=minDist=>{const pool=cands.slice(),out=[],tc={},cc={};
    while(out.length<3&&pool.length){const cats=[...new Set(pool.map(c=>c.cat))];const cat=pk(r,cats);const inCat=pool.filter(c=>c.cat===cat);const c=pk(r,inCat);pool.splice(pool.indexOf(c),1);
      if(out.some(o=>o.i===c.i))continue;if(c.g&&out.some(o=>o.g===c.g))continue;if((tc[c.t]||0)>=2)continue;if((cc[c.cat]||0)>=2)continue;
      if(c.easy&&out.some(o=>o.easy))continue;
      const cx=c.b[0]+c.b[2]/2,cy=c.b[1]+c.b[3]/2;if(out.some(o=>Math.hypot(cx-o.b[0]-o.b[2]/2,cy-o.b[1]-o.b[3]/2)<minDist))continue;
      out.push(c);tc[c.t]=(tc[c.t]||0)+1;cc[c.cat]=(cc[c.cat]||0)+1;}
    return out;};
  let out=[];for(const d of[16,16,12,8]){out=tryPick(d);if(out.length===3)break;}
  return{diffs:out,all:cands.length};}
function renderItems(items,diffs){return items.map((it,i)=>({it,i})).sort((a,b)=>(a.it.z||0)-(b.it.z||0)||a.i-b.i)
  .map(({it,i})=>{const d=diffs&&diffs.find(x=>x.i===i);return K[it.kind].draw(d?d.p2:it.p);}).join('');}
const GENS=[];const gadd=(name,sub,gen)=>GENS.push({name,sub,gen});

/* ================= POND PARK ================= */
const WALLS=['#c2733a','#e0a95f','#8b95a5','#a7b4c2','#d4a65a','#b45309','#94a3b8'];const ROOFS=['#7c2d12','#9a3412','#334155','#475569'];const DOORS=['#5b3a1e','#1e3a8a','#166534','#7f1d1d','#d97706','#f1f5f9'];
const WORDS=['BAKERY','CAFE','BOOKS','FLOWERS','TOYS','SHOES'];
K.bld={draw:p=>{const x=p.x,t=p.top;let s='';
  if(p.type==='house'){if(p.chimney)s+=R(x+18,t-9,3,6,'#7c2d12');s+=Pg(`${x-1},${t} ${x+13},${t-10} ${x+27},${t}`,p.roof)+R(x,t,26,40-t,p.wall)+R(x+10.5,32,5,8,p.door)+C(x+14.5,36,0.4,'#fbbf24');}
  if(p.type==='townhouse')s+=R(x,t,26,40-t,p.wall)+R(x-0.5,t-1.5,27,1.5,p.roof)+R(x+10.5,32,5,8,p.door)+C(x+14.5,36,0.4,'#fbbf24');
  if(p.type==='shop'){s+=R(x,t,26,40-t,p.wall)+R(x-0.5,t-1.5,27,1.5,p.roof)+R(x+2,t+2,22,5,'#1f2937')+T(x+13,t+5.8,3.4,'#fde68a',p.word);
    for(let i=0;i<6;i++)s+=R(x+1+i*4,29,4,3.5,i%2?'#f1f5f9':p.awning);s+=R(x+3,33,12,7,'#bae6fd')+R(x+18,33,5,7,p.door);}
  return s;},
 muts:(p,r)=>{const x=p.x,t=p.top,m=[];

  [[11,s1],[28,pk(r,['toaster','mugs'])],[74,pk(r,['fruit','bread'])],[88,s4]].forEach(([x,v])=>add('counter',{x,v,c:v==='kettle'?pk(r,['#ef4444','#2563eb']):v==='plant'?pk(r,['#b45309','#2563eb']):pk(r,['#94a3b8','#dc2626']),f:r()<0.5,lids:[0,1,2].map(()=>pk(r,JARC)),toast:r()<0.5,cs:[pk(r,['#3b82f6','#ef4444']),pk(r,['#facc15','#f1f5f9'])],ac:pk(r,['#ef4444','#84cc16']),ban:r()<0.7,n:ri(r,2,3),knife:r()<0.7,car:r()<0.7},2));
  add('stove',{steam:r()<0.7,egg:r()<0.7,lid:'#64748b'},2);
  add('oven',{k:[0,1,2,3].map(()=>r()<0.7?0:Math.PI/2),light:r()<0.3,towel:r()<0.7,tc:pk(r,['#dc2626','#2563eb'])},2);
  const lo=pk(r,[0,3]);[[2,15,false],[19,15,true],[66,13,false],[81,13,true]].forEach(([x,w,hr],i)=>add('lower',{x,w,hr,open:i===lo,knob:r()<0.7,bc:pk(r,['#16a34a','#f59e0b']),spray:r()<0.7},1));
  MAGS.forEach(([x,y])=>add('magnet',{x,y,on:r()<0.7,v:pk(r,['circle','square','star']),c:pk(r,['#ef4444','#facc15','#2563eb','#16a34a'])},2));
  add('drawing',{h:r()<0.5,hc:pk(r,['#ef4444','#2563eb']),n:ri(r,2,3)},2);
  return items;});
/* ================= cards ================= */
const out=document.getElementById('out');
GENS.forEach((g,n)=>{const id='g'+n;
  out.insertAdjacentHTML('beforeend',`<div class="card"><div class="head"><b>${g.name}</b><span>${g.sub}</span><span class="grow"></span><span id="${id}c"></span><span id="${id}f">0 / 3</span>
    <button id="${id}p">New picture</button><button id="${id}n">New differences</button><button id="${id}b">Show</button></div>
    <div class="pair"><svg id="${id}L" viewBox="0 0 120 90"></svg><svg id="${id}R" viewBox="0 0 120 90"></svg></div></div>`);
  const L_=document.getElementById(id+'L'),R_=document.getElementById(id+'R');let items,diffs=[],found=new Set(),show=false;
  const marks=()=>{let s='';diffs.forEach((d,k)=>{const[x,y,w,hh]=d.b;if(found.has(k))s+=R(x-1.5,y-1.5,w+3,hh+3,'none','rx="2" stroke="#4ade80" stroke-width="1"');else if(show)s+=R(x-1.5,y-1.5,w+3,hh+3,'none','rx="2" stroke="#f87171" stroke-width="0.9" stroke-dasharray="2 1.5"');if(show&&d.easy)s+=T(x+w/2,Math.max(4,y-2.5),3,'#fbbf24','easy');});
    L_.lastElementChild.innerHTML=s;R_.lastElementChild.innerHTML=s;document.getElementById(id+'f').textContent=`${found.size} / 3`;};
  const newDiffs=()=>{const seed=Math.floor(Math.random()*1e9);const res=pickDiffs(items,rnd(seed));diffs=res.diffs;found=new Set();show=false;
    document.getElementById(id+'c').textContent=`${res.all} possible changes`;L_.innerHTML=renderItems(items)+'<g></g>';R_.innerHTML=renderItems(items,diffs)+'<g></g>';marks();};
  const newPic=()=>{items=g.gen(rnd(Math.random()*1e9));newDiffs();};
  document.getElementById(id+'p').onclick=newPic;document.getElementById(id+'n').onclick=newDiffs;document.getElementById(id+'b').onclick=()=>{show=!show;marks();};
  [L_,R_].forEach(v=>v.addEventListener('pointerdown',e=>{const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*120,y=(e.clientY-r.top)/r.height*90;
    const k=diffs.findIndex(d=>x>=d.b[0]-2.5&&x<=d.b[0]+d.b[2]+2.5&&y>=d.b[1]-2.5&&y<=d.b[1]+d.b[3]+2.5);
    if(k>=0){found.add(k);marks();return;}
    const gg=document.createElementNS('http://www.w3.org/2000/svg','g');gg.innerHTML=`<path d="M${x-3} ${y-3}L${x+3} ${y+3}M${x+3} ${y-3}L${x-3} ${y+3}" stroke="#f87171" stroke-width="1.4"/>`;v.appendChild(gg);setTimeout(()=>gg.remove(),700);}));
  window['dbg'+n]=()=>{let s='';items.forEach((it,i)=>{const k=K[it.kind];if(!k.muts)return;k.muts(it.p,rnd(1)).forEach(m=>{s+=R(...m.b,'none','stroke="#22d3ee" stroke-width="0.4"');});});R_.innerHTML=renderItems(items)+'<g>'+s+'</g>';};
  newPic();});

</script></body></html>
